# ─── Hierarchical MDLM Training Configuration ──────────────────────────────

# Model
pretrained_path: "kuleshov-group/mdlm-owt"
vocab_size: 50258          # GPT-2 (50257) + 1 mask token
num_levels: 2              # K = number of hierarchy levels
hidden_size: 768           # DDiT hidden dimension
cond_dim: 128              # DDiT timestep conditioning dimension
max_length: 1024           # maximum sequence length

# Noise schedule
noise_type: "loglinear"
sampling_eps: 0.001
antithetic_sampling: true
# Per-level noise scales: level 0 (summary) = low noise, level 1 (text) = high noise
noise_level_scales:
  - 0.5     # summary — half the base noise
  - 1.0     # text    — full base noise

# Dataset
dataset: "wikihow"              # "wikihow" or "json"
wikihow_max_samples: null       # set to an int for debugging (e.g. 1000)

# LoRA
lora_rank: 8
lora_alpha: 16.0
lora_dropout: 0.05

# Phase 1: Full fine-tune output heads + hierarchy embedding (backbone frozen)
phase1_lr: 1.0e-4
phase1_weight_decay: 0.0
phase1_max_steps: 10000
phase1_batch_size: 32
phase1_grad_clip: 1.0
phase1_warmup_steps: 500        # linear warmup from 0 → phase1_lr
phase1_min_lr: 1.0e-6           # cosine decay target after warmup
phase1_unfreeze_last_n_blocks: 4  # unfreeze last N DDiT backbone blocks (0 = fully frozen)

# Phase 2: Backbone LoRA + continued full fine-tune of output heads
phase2_lora_target_modules:
  - ".*\\.attn_qkv$"            # DDiT attention QKV
  - ".*\\.attn_out$"            # DDiT attention output
  - ".*\\.mlp\\.0$"             # DDiT MLP first linear
  - ".*\\.mlp\\.2$"             # DDiT MLP second linear
phase2_lr: 3.0e-5
phase2_weight_decay: 0.01
phase2_max_steps: 50000
phase2_batch_size: 16
phase2_grad_clip: 1.0

# General
device: "cuda"
log_every: 100
save_every: 5000
save_dir: "checkpoints"
seed: 42

# Weights & Biases
wandb_project: "hierarchical-mdlm"
wandb_entity: ""                    # leave empty to use default entity
wandb_run_name: ""                  # leave empty for auto-generated name
wandb_mode: "online"                # "online", "offline", or "disabled"
